[build-system]
requires=["setuptools>=61"]
build-backend="setuptools.build_meta"

[project]
name="pywebbridge"
version="0.1.1"
description="网页中的JavaScript与服务端的Python对象级互操作"
readme="README.md"
requires-python=">=3.14"
license="MIT"
dependencies=[
    "flask",
    "flask-sock"
    ]

[tool.setuptools]
include-package-data=false

[tool.setuptools.package-dir]
pywebbridge="."

[tool.setuptools.package-data]
pywebbridge=["**/*.js"]

[tool.setuptools.exclude-package-data]
pydsh=["build/**",".git/**","*.egg-info/**"]